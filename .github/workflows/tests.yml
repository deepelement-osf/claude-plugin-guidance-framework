# Runs the standard-library unit tests for the guidance scripts on every pull
# request into main. The tests need only python3 and git, both present on
# ubuntu-latest; they build their own fixture repositories in temporary
# directories and do not depend on the checkout's submodules.

name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
